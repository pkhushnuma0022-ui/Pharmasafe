<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PharmaSafe Demo</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f8f5;color:#17351f}
header{background:#087f3f;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:30px} header p{margin:6px 0 0}
.container{max-width:850px;margin:20px auto;padding:0 14px}
.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}
.status{display:inline-block;padding:7px 13px;border-radius:20px;font-weight:bold}
.safe{background:#dff5df;color:#14752a}.near{background:#fff1bd;color:#8a6500}.expired{background:#ffdede;color:#a51f1f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.box{border:1px solid #dce7df;border-radius:12px;padding:13px}
h2,h3{margin-top:0}.label{font-size:12px;color:#66806d;text-transform:uppercase}
button{border:0;border-radius:10px;padding:11px 15px;background:#087f3f;color:white;font-weight:bold;margin:4px;cursor:pointer}
button.secondary{background:#e9f1eb;color:#17351f}
.alert{padding:12px;border-radius:10px;background:#fff7df;margin-top:10px}
footer{text-align:center;padding:25px;color:#66806d;font-size:13px}
.small{font-size:13px;color:#58705f}
</style>
</head>
<body>
<header><h1>🛡️ PHARMASAFE</h1><p>Smart Medicine Information, Adherence & Expiry Management</p></header>
<div class="container" id="app"></div>
<footer>Educational prototype for innovation competition • Always follow the prescription/label and pharmacist/doctor advice.</footer>
<script>
const meds={
 paracetamol:{
  name:"Paracetamol 500 mg Tablets",batch:"PCT2594",mfg:"09/2025",expiry:"09/2027",
  status:"SAFE",cls:"safe",
  uses:"Relief of mild to moderate pain and reduction of fever.",
  dose:"Use only as directed on the product label or by a healthcare professional. Do not exceed the labelled maximum dose.",
  adverse:"Nausea or stomach discomfort may occur. Serious allergic reactions or severe skin reactions are uncommon but require urgent medical attention.",
  interactions:"Check with a pharmacist/doctor if taking other medicines that contain paracetamol/acetaminophen, or if you have liver disease or regularly consume alcohol.",
  adherence:"Set a reminder according to the prescribed schedule. The system does not change the prescribed dose."
 },
 amoxicillin:{
  name:"Amoxicillin 500 mg Capsules",batch:"AMX2601",mfg:"09/2024",expiry:"09/2026",
  status:"NEAR EXPIRY",cls:"near",
  uses:"An antibiotic used for certain bacterial infections when prescribed.",
  dose:"Take exactly as prescribed. Do not start, stop, or change the dose without professional advice.",
  adverse:"Common effects include nausea, diarrhoea and rash. Seek urgent help for signs of a serious allergic reaction such as swelling or difficulty breathing.",
  interactions:"Tell the pharmacist/doctor about other medicines, especially anticoagulants or medicines known to interact with antibiotics.",
  adherence:"For a prescribed antibiotic course, reminders can help patients take doses on schedule. Do not double a missed dose unless instructed."
 },
 medicinex:{
  name:"Medicine X (Demo Stock)",batch:"MX2204",mfg:"06/2024",expiry:"06/2026",
  status:"EXPIRED",cls:"expired",
  uses:"Demonstration item only — not for patient use.",
  dose:"Do not dispense or administer this demo item.",
  adverse:"Not applicable to this demonstration stock.",
  interactions:"Not applicable to this demonstration stock.",
  adherence:"Not applicable."
 }
};
function render(id){
 const m=meds[id]||meds.paracetamol;
 const action=m.status==="EXPIRED"?"QUARANTINE / DISPOSAL RECORD":m.status==="NEAR EXPIRY"?"REVIEW / RETURN TO SUPPLIER":"AVAILABLE FOR SALE";
 document.getElementById("app").innerHTML=`
 <div class="card">
   <div class="label">Medicine</div><h2>${m.name}</h2>
   <span class="status ${m.cls}">${m.status}</span>
   <div class="grid" style="margin-top:15px">
    <div class="box"><div class="label">Batch</div><b>${m.batch}</b></div>
    <div class="box"><div class="label">Manufacturing</div><b>${m.mfg}</b></div>
    <div class="box"><div class="label">Expiry</div><b>${m.expiry}</b></div>
   </div>
 </div>
 <div class="card"><h3>💊 Complete Medicine Information</h3>
  <div class="grid">
   <div class="box"><b>Uses / Indications</b><p>${m.uses}</p></div>
   <div class="box"><b>Dose & How to Take</b><p>${m.dose}</p></div>
   <div class="box"><b>Adverse Effects</b><p>${m.adverse}</p></div>
   <div class="box"><b>Interactions & Precautions</b><p>${m.interactions}</p></div>
  </div>
 </div>
 <div class="card"><h3>🔔 Drug Adherence Support</h3>
   <p>${m.adherence}</p>
   <button onclick="remind()">Set Dose Reminder</button>
   <button class="secondary" onclick="missed()">Mark Dose Taken</button>
   <div id="reminder"></div>
 </div>
 <div class="card"><h3>📦 Stock Action</h3>
   <p><b>Recommended system action:</b> ${action}</p>
   ${m.status==="EXPIRED"?'<div class="alert">⚠️ Expired stock must not be dispensed. Record quarantine/disposal according to applicable requirements.</div>':m.status==="NEAR EXPIRY"?'<div class="alert">⚠️ Near-expiry stock should be reviewed and handled according to the pharmacy/supplier procedure.</div>':'<div class="alert">✅ Stock is currently within the demonstration expiry period.</div>'}
 </div>
 <div class="card"><h3>🔎 Demo Scan</h3>
  <p class="small">Choose another sample medicine to demonstrate the system.</p>
  <button onclick="location.hash='med=paracetamol';render('paracetamol')">Paracetamol</button>
  <button onclick="location.hash='med=amoxicillin';render('amoxicillin')">Amoxicillin</button>
  <button onclick="location.hash='med=medicinex';render('medicinex')">Expired Demo</button>
 </div>`;
}
function remind(){document.getElementById("reminder").innerHTML='<div class="alert">🔔 Demo reminder saved. In a full app, this would trigger at the prescribed time.</div>'}
function missed(){document.getElementById("reminder").innerHTML='<div class="alert">✅ Demo: dose recorded as taken.</div>'}
function current(){return new URLSearchParams(location.hash.replace("#","")).get("med")||"paracetamol"}
render(current());
window.addEventListener("hashchange",()=>render(current()));
</script>
</body>
</html>
